version: 2
updates:
  # GitHub Actions（actions/checkout など）を最新に保つ
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns: ['*']

  # ビルド用の npm 依存（archiver など）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      npm:
        patterns: ['*']
