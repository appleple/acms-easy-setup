name: Test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  # 利用者の環境（PHP 7.2〜）で動くことを、構文チェックとテストで確認する
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.4', '8.1', '8.3', '8.5']

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, pdo_sqlite
          coverage: none

      - name: Lint
        run: find packages -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test (update.php)
        run: php tests/run.php update

      - name: Test (setup.php)
        run: php tests/run.php install

  # 行カバレッジ 90% 以上を必須にする
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, pdo_sqlite
          coverage: pcov

      - name: Coverage (update.php)
        run: php -d pcov.enabled=1 -d pcov.directory=. tests/run.php update --coverage=90

      - name: Coverage (setup.php)
        run: php -d pcov.enabled=1 -d pcov.directory=. tests/run.php install --coverage=90

  # Dependabot の更新 PR は、上のテストとカバレッジがすべて成功した後に自動でマージする。
  # GitHub 標準の auto-merge は「必須チェック付きのブランチ保護」が前提で、無いと CI を待たずに
  # 即マージされるため使わず、needs でこのワークフロー自身の成功を待ってからマージする。
  # major 更新は破壊的変更を含みうるので対象外（手動で確認する）。
  dependabot-automerge:
    needs: [test, coverage]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge (minor / patch only)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
