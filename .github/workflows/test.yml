name: Test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  # 利用者の環境（PHP 7.2〜）で動くことを、構文チェックとテストで確認する
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.4', '8.1', '8.3', '8.5']

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, pdo_sqlite
          coverage: none

      - name: Lint
        run: find packages -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test (update.php)
        run: php tests/run.php update

      - name: Test (setup.php)
        run: php tests/run.php install

  # 行カバレッジ 90% 以上を必須にする
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, pdo_sqlite
          coverage: pcov

      - name: Coverage (update.php)
        run: php -d pcov.enabled=1 -d pcov.directory=. tests/run.php update --coverage=90

      - name: Coverage (setup.php)
        run: php -d pcov.enabled=1 -d pcov.directory=. tests/run.php install --coverage=90
